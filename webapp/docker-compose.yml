services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 5000
      CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    expose:
      - "5000"
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
