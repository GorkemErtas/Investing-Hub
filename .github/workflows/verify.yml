name: Verify pull request

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/analytics-lab]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      # Isolated CI database; never connects to Atlas or an existing database.
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mobileapp
      - run: npm test
        env:
          MONGO_TEST_PORT: "27017"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm ci --prefix .railway --ignore-scripts
      - run: npm --prefix .railway run typecheck
      - run: npm run check:mobile
      - run: npm run test:mobile
      - run: npm --prefix mobileapp run lint
      - run: npm --prefix mobileapp run test:browser
        env:
          EXPO_NO_DOTENV: "1"
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml -p 'test_*.py'
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker build -t investing-hub-railway:test .
      - run: python deploy/railway/smoke.py
