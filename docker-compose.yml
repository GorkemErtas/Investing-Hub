# /home/ubuntu/ihapp/docker-compose.yml
version: "3.9"

services:
  ######################################################################
  #  DATABASE – MongoDB (27017)
  ######################################################################
  mongo:
    image: mongo:6
    container_name: ihapp_mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  ######################################################################
  #  BACKEND – Node.js + Express (5000)
  ######################################################################
  backend:
    build:
      context: ./backend
    container_name: ihapp_backend
    depends_on:
      - mongo
    expose:
      - "5000"
    ports:                       # <─ **AÇTIK**
      - "5000:5000"
    restart: unless-stopped
    env_file:
      - ./backend/.env
    # environment:
    #   - MONGO_URI=mongodb://mongo:27017/ihapp

  ######################################################################
  #  WEB – Nginx (statik SPA + reverse-proxy)
  ######################################################################
  web:
    image: nginx:alpine
    container_name: ihapp_web
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/web.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

######################################################################
#  VOLUMES
######################################################################
volumes:
  mongo_data:


