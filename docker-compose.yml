version: "3.9"  # veya tamamen kaldırabilirsiniz

services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - mobil-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mobil-backend
    depends_on:
      - mongo
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "6001:6001"
    networks:
      - mobil-net

  frontend:
    # Frontend build context ve yapı size bağlı; eğer ayrıysa düzenleyin
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mobil-frontend
    depends_on:
      - backend
    restart: unless-stopped
    ports:
      - "8080:80"
    networks:
      - mobil-net

volumes:
  mongo_data:

networks:
  mobil-net:
    driver: bridge

