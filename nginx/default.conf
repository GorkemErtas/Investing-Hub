# ----------  /home/ubuntu/ihapp/nginx/default.conf  ----------
map $http_accept $json_request {
    "~*application/json"   1;
    default                0;
}

upstream backend { server backend:5000; }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # İlk deneme: dosya mevcutsa ver
    location / {
        try_files $uri $uri/ @fallback;
    }

    # SPA’de dosya yoksa (veya JSON isteyenler) buraya düşer
    location @fallback {

        #  ➜ Tarayıcı HTML istiyorsa  index.html’e çevir
        if ($json_request = 0) {
            rewrite ^ /index.html break;
        }

        #  ➜ JSON / API çağrıları backend’e proxy’lenir
        proxy_pass              http://backend;
        proxy_set_header Host   $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    }
}
# -------------------------------------------------------------


