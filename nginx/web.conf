# ---------- /home/ubuntu/ihapp/nginx/web.conf ----------
# İstek “Accept: application/json” taşıyorsa $is_json = 1
map $http_accept $is_json {
    "~*application/json" 1;
    default              0;
}

# Backend upstream
upstream backend_upstream {
    server ihapp_backend:5000;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 1) Açıkça bildiğimiz API path’leri doğrudan backend’e gönder
    # ------------------------------------------------------------------
    location ~ ^/(crypto-data|gainers|losers|top-exchanges|refresh-data|predict|graph-data|graph-candles|api/fibonacci|crypto-news|geminicrypto-news|register|verify|login|settings|triggered-alerts|create-portfolio|portfolio|portfolios)(/.*|$) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 2) Accept: application/json başlığı varsa  ->  internal backend
    # ------------------------------------------------------------------
    location @json_api {                 # INTERNAL – dışarıdan erişilemez
        internal;
        proxy_pass http://backend_upstream$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # 3) Kalan her şey  =>  statik dosya  |  SPA fallback
    # ------------------------------------------------------------------
    location / {
        if ($is_json) { rewrite ^ /@json_api last; }   # sadece yönlendir
        try_files $uri $uri/ /index.html;
    }
}

